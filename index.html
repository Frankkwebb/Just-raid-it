<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1a24">
<title>RaidLords: Realms</title>
<style>:root{--ink:#3a2a1a;--cream:#fff3d1;--gold:#ffc83d;--red:#ff6a5a;--blue:#4aa8ff;--panel:rgba(38,24,10,.74)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0f1a24;color:var(--cream);overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif}
#root{position:fixed;inset:0}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ft{position:absolute;left:0;top:0;font-weight:900;color:#fff;white-space:nowrap;will-change:transform,opacity;pointer-events:none;opacity:0;
  text-shadow:-1.5px -1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px 1.5px 0 var(--ink),0 3px 0 var(--ink)}
.nm{position:absolute;left:0;top:0;font-weight:900;font-size:13px;color:var(--cream);will-change:transform;pointer-events:none;opacity:0;letter-spacing:.3px;
  text-shadow:-1.5px -1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px 1.5px 0 var(--ink)}
.hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px);display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:5px 11px;font-weight:900;display:flex;align-items:center;gap:7px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn-ic{pointer-events:auto;background:var(--panel);border:2px solid var(--ink);border-radius:12px;width:40px;height:40px;color:var(--cream);font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-family:inherit}
.btn-ic:active{transform:translateY(2px)}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a8,#ffc83d 55%,#d9981a);border:2px solid var(--ink);display:inline-block}
.timer{font-size:22px;color:var(--cream);letter-spacing:.5px;min-width:78px;justify-content:center;flex-direction:column;gap:3px;padding:4px 12px 6px}
.timer.low{color:var(--red)}
.day{width:64px;height:5px;border-radius:3px;background:linear-gradient(90deg,#8fd3ff,#ffe9a0 50%,#ff9a5a 80%,#7a6aa8);position:relative;border:1px solid var(--ink)}
.day i{position:absolute;top:-4px;width:10px;height:10px;border-radius:50%;background:#fff3d1;border:2px solid var(--ink);transform:translateX(-50%)}
.row2{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 62px);padding:0 calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px);display:flex;justify-content:space-between;align-items:flex-start}
.bars{display:flex;flex-direction:column;gap:6px;width:min(46vw,190px)}
.bar{background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:3px 6px 5px;font-size:11px;font-weight:900;letter-spacing:.4px}
.bar b{display:flex;justify-content:space-between;margin-bottom:2px;text-shadow:0 1px 0 var(--ink)}
.track{height:8px;border-radius:5px;background:#1d130a;overflow:hidden;border:1px solid #000}
.fill{height:100%;border-radius:4px;transition:width .12s linear}
.mm{width:112px;height:112px;border-radius:16px;border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.4);display:block;background:#16240f}
.mmwrap{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.chips{display:flex;gap:5px;font-size:11px;font-weight:900}
.chip{background:var(--panel);border:2px solid var(--ink);border-radius:9px;padding:2px 7px}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 12px);display:flex;justify-content:flex-end;align-items:flex-end}
.vit{position:absolute;left:calc(env(safe-area-inset-left,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);width:min(38vw,150px);display:flex;flex-direction:column;gap:4px}
.vit .track{height:12px}
.vit small{text-align:center;font-size:11px;font-weight:900;text-shadow:0 1px 0 var(--ink)}
.acts{display:flex;gap:12px;align-items:flex-end}
.abtn{pointer-events:auto;touch-action:none;border-radius:50%;border:4px solid var(--ink);color:var(--ink);font-weight:900;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:inherit;position:relative;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.4);cursor:pointer;padding:0}
.abtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.abtn.spin{width:86px;height:86px;background:radial-gradient(circle at 35% 30%,#ffe27a,#ffc83d 60%,#e0a010);font-size:15px}
.abtn.run{width:64px;height:64px;background:radial-gradient(circle at 35% 30%,#bfe3ff,#4aa8ff 60%,#2f78c9);font-size:12px}
.abtn.off{filter:grayscale(.85) brightness(.75)}
.abtn .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(20,12,5,.55)}
.abtn span{position:relative;z-index:1;line-height:1}
.abtn em{font-style:normal;font-size:20px;display:block;margin-bottom:2px;position:relative;z-index:1}
.zone{position:absolute;left:0;top:30%;bottom:0;width:62%;pointer-events:auto;touch-action:none}
.stick{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:rgba(255,243,209,.18);border:3px solid rgba(255,243,209,.55);pointer-events:none}
.stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,243,209,.85);border:3px solid var(--ink)}
.stickhint{position:absolute;left:calc(env(safe-area-inset-left,0px) + 34px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:96px;height:96px;border-radius:50%;border:3px dashed rgba(255,243,209,.35);pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:rgba(255,243,209,.55)}
.alert{position:absolute;left:50%;top:27%;transform:translateX(-50%);max-width:92vw;text-align:center;font-weight:900;font-size:clamp(15px,4.4vw,24px);line-height:1.15;padding:8px 16px;border-radius:14px;background:rgba(30,18,6,.7);border:2px solid var(--ink);animation:pop .35s ease-out;text-shadow:0 2px 0 var(--ink)}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}70%{transform:translateX(-50%) scale(1.07)}100%{transform:translateX(-50%) scale(1);opacity:1}}
.arrow{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;display:flex;align-items:center;justify-content:center}
.arrow svg{width:44px;height:44px;filter:drop-shadow(0 2px 0 var(--ink))}
.arrow small{position:absolute;top:30px;font-size:11px;font-weight:900;text-shadow:-1px -1px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink)}
.hurt{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 110px 26px rgba(255,40,30,var(--h,0))}
.ko{position:absolute;inset:0;background:rgba(20,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;pointer-events:none;text-shadow:0 3px 0 var(--ink)}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:auto;padding:16px}
.dim{background:rgba(12,8,4,.62);backdrop-filter:blur(2px)}
.card{background:#fff3d1;color:var(--ink);border:5px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 rgba(0,0,0,.45);padding:20px 20px 22px;width:min(92vw,400px);text-align:center;max-height:94vh;overflow:auto}
.title{font-size:clamp(40px,12vw,64px);font-weight:900;line-height:.95;color:var(--gold);letter-spacing:1px;transform:rotate(-2deg);
  text-shadow:-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px 3px 0 var(--ink),0 6px 0 var(--ink),0 10px 14px rgba(0,0,0,.5)}
.sub{font-size:clamp(16px,5vw,24px);font-weight:900;letter-spacing:3px;margin-top:10px;color:var(--cream);text-shadow:-2px -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink)}
.go{pointer-events:auto;border:4px solid var(--ink);background:linear-gradient(#ffd95a,#ffc83d 55%,#e8a812);color:var(--ink);font-weight:900;font-size:24px;letter-spacing:1px;border-radius:18px;padding:12px 30px;box-shadow:0 6px 0 var(--ink);cursor:pointer;font-family:inherit;animation:bob 1.6s ease-in-out infinite}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.go.alt{background:linear-gradient(#bfe3ff,#8fc7f5 55%,#5aa8e8);font-size:17px;padding:9px 18px;animation:none}
@keyframes bob{50%{transform:scale(1.04)}}
.inp{width:min(70vw,240px);text-align:center;font:900 22px "Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:var(--cream);border:4px solid var(--ink);border-radius:14px;padding:8px 10px;outline:none;user-select:text;-webkit-user-select:text}
.lbl{font-size:12px;font-weight:900;letter-spacing:2px;margin:18px 0 6px;color:var(--cream);text-shadow:-1px -1px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink)}
.tips{margin-top:18px;font-size:13px;font-weight:700;line-height:1.5;text-align:center;max-width:340px;color:var(--cream);text-shadow:-1px -1px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink)}
.menu{justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 26px);background:linear-gradient(180deg,rgba(10,16,24,.0) 0%,rgba(10,16,24,.15) 38%,rgba(10,16,24,.7) 100%)}
.menu .top2{position:absolute;top:9%;left:0;right:0;text-align:center}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.star{width:56px;height:56px;filter:drop-shadow(0 3px 0 var(--ink))}
.star:nth-child(2){transform:translateY(-10px) scale(1.12)}
.h1{font-size:28px;font-weight:900;margin:0}
.res{font-size:13px;font-weight:700;color:#7a6a4a;margin:2px 0 8px}
.obj{display:flex;align-items:center;gap:8px;text-align:left;font-weight:800;font-size:14px;padding:5px 0}
.obj i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;flex:none;background:#d9cba6}
.obj.ok i{background:#7fe08a}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.stat{background:#f1dfae;border:3px solid var(--ink);border-radius:12px;padding:6px 4px;font-weight:900;font-size:19px;line-height:1.1}
.stat small{display:block;font-size:10px;letter-spacing:1px;color:#7a6a4a}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{pointer-events:auto;display:flex;align-items:center;gap:12px;text-align:left;border:4px solid var(--ink);border-radius:16px;background:#f7e6b3;color:var(--ink);padding:10px 14px;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt em{font-style:normal;font-size:30px;flex:none}
.opt b{display:block;font-size:17px}
.opt span{font-size:13px;font-weight:700;color:#6b5a3a}
</style></head><body><div id="root"></div>
